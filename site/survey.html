        <main>

            <div>
                <h1>Survey</h1>
                <form action="https://formspree.io/f/meoaqgne" method="post">
                    <p>
                        <label for="name_field">What is your name?<abbr title="required"
                                aria-label="required">*</abbr></label>
                        <input type="text" name="name_field" id="name_field" required>
                    </p>

                    <p>
                        <label for="email_field">What is your email?<abbr title="required"
                                aria-label="required">*</abbr></label>
                        <input type="email" name="email_field" id="email_field" required>
                    </p>

                    <p>
                        <Label for="best_whole_number">Which whole number is best?</Label>
                        <input type="number" name="best_whole_number" id="best_whole_number" min="1">
                    </p>

                    <p>
                        <label for="best_day">Which day is best?</label>
                        <input type="date" name="best_day" id="best_day">
                    </p>

                    <p>
                        <label for="best_bear">Which bear is best?<abbr title="required"
                                aria-label="required">*</abbr></label>
                        <select name="best_bear" id="best_bear" required>
                            <option value="">&nbsp;</option>
                            <option value="Black">Black</option>
                            <option value="Brown">Brown</option>
                            <option value="Care">Care</option>
                            <option value="Panda">Panda</option>
                            <option value="Polar">Polar</option>
                            <option value="Teddy">Teddy</option>
                        </select>
                    </p>

                    <fieldset>
                        <legend>Do you like radio buttons?</legend>
                        <ul>
                            <li><input type="radio" name="enjoys_radio_buttons" value="yes" id="yes"><label
                                    for="yes">Yes</label></li>
                            <li><input type="radio" name="enjoys_radio_buttons" value="no" id="no"><label
                                    for="no">No</label></li>
                            <li><input type="radio" name="enjoys_radio_buttons" value="?" id="?"><label for="?">None of
                                    your business</label></li>
                        </ul>
                    </fieldset>

                    <p>
                        <label for="life_meaning">What is the meaning of life?</label>
                        <textarea name="life_meaning" id="life_meaning" rows="5" cols="50"
                            placeholder="Enter the correct answer here"></textarea>
                    </p>

                    <p>
                        <button type="submit" name="send_button" id="send_button">Send</button>
                    </p> 

                </form>
            </div>


        </main>
